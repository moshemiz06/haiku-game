<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Orbit Flip</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05030f; color: #e9e4ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 120, 50, 0.45) 100%);
  }

  #hud, #heat-label, #heat-wrap { opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  body.playing #hud, body.playing #heat-label, body.playing #heat-wrap,
  body.paused #hud, body.paused #heat-label, body.paused #heat-wrap { opacity: 1; }

  #hud { position: fixed; top: 16px; left: 20px; }
  #score {
    font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(255, 160, 70, 0.45);
  }
  #mult { font-size: 16px; font-weight: 600; color: #ffb36b; letter-spacing: 0.08em; }
  #chain { font-size: 14px; font-weight: 700; color: #7cf7ff; letter-spacing: 0.1em; min-height: 18px; }

  #heat-label {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.3em; opacity: 0.6;
  }
  #heat-wrap {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: min(60vw, 360px); height: 8px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.08); overflow: hidden;
  }
  #heat { height: 100%; width: 0; background: linear-gradient(90deg, #7cf7ff, #ffb36b, #fff3c4); box-shadow: 0 0 12px #ffb36b; }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(40px, 9vw, 84px); margin: 0 0 14px; font-weight: 800; letter-spacing: 0.12em;
    background: linear-gradient(90deg, #7cf7ff, #ffb36b); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay p { margin: 6px 0; max-width: 520px; line-height: 1.55; opacity: 0.85; }
  #overlay b { color: #ffb36b; }
  #overlay .hint { margin-top: 24px; opacity: 0.6; animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud"><div id="score">0</div><div id="mult">×1</div><div id="chain"></div></div>
<div id="heat-label">HEAT</div>
<div id="heat-wrap"><div id="heat"></div></div>
<div id="overlay"></div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const VIEW = 780;       // world units visible across the shorter screen side
  const SUN_R = 38;
  const R_MIN = 105;      // deepest dive
  const R_BASE = 300;     // resting orbit
  const SPAWN_R = 640;
  const PLAYER_R = 8;
  const NEAR_MISS = 26;   // how close an asteroid must pass to count as a near miss
  const GM = 3.2e6;       // the sun's gravity: it bends asteroid paths too
  const BEST_KEY = 'orbit-flip-best';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const vignetteEl = document.getElementById('vignette');
  const scoreEl = document.getElementById('score');
  const multEl = document.getElementById('mult');
  const heatEl = document.getElementById('heat');
  const chainEl = document.getElementById('chain');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  let W, H, dpr, scale;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    scale = Math.min(W, H) / VIEW;
  }
  window.addEventListener('resize', resize);
  resize();

  const bgStars = Array.from({ length: 180 }, () => ({
    x: Math.random(), y: Math.random(), r: rand(0.4, 1.4), ph: rand(0, TAU),
  }));

  let best = 0;
  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (_) {}

  let state = 'title';   // 'title' | 'play' | 'paused' | 'over'
  let clock = 0, overAt = 0, shake = 0, elapsed = 0, score = 0;
  let spawnTimer = 0, starTimer = 0, diving = false;
  let combo = 0, comboTimer = 0, muted = false;
  let player, asteroids, stardust, particles, trail, rings, popups;

  function reset() {
    asteroids = []; stardust = []; particles = []; trail = []; rings = []; popups = [];
    player = { theta: -Math.PI / 2, r: R_BASE, dir: 1, heat: 0, x: 0, y: 0 };
    placePlayer();
    score = 0; elapsed = 0; diving = false;
    combo = 0; comboTimer = 0;
    spawnTimer = 1.2; starTimer = 0.4;
  }

  const multiplier = () => 1 + Math.round(player.heat * 4);

  function placePlayer() {
    const p = player;
    p.x = Math.cos(p.theta) * p.r;
    p.y = Math.sin(p.theta) * p.r;
    trail.push({ x: p.x, y: p.y, life: 1 });
  }

  // Where the satellite will be t seconds from now if it keeps its current orbit
  function playerAt(t) {
    const p = player, th = p.theta + p.dir * (0.9 + 1.6 * p.heat) * t;
    return [Math.cos(th) * p.r, Math.sin(th) * p.r];
  }

  // Advance a rock under the sun's gravity (softened so nothing blows up at the core)
  function gravityStep(r, dt) {
    const d2 = Math.max(r.x * r.x + r.y * r.y, 1), d = Math.sqrt(d2);
    const acc = GM / Math.max(d2, 1600);
    r.vx -= (r.x / d) * acc * dt;
    r.vy -= (r.y / d) * acc * dt;
    r.x += r.vx * dt;
    r.y += r.vy * dt;
  }

  // Fly a rock forward under the sun's gravity and return its closest approach to the satellite
  function closestApproach(x, y, vx, vy) {
    const step = 0.05, rock = { x, y, vx, vy };
    let best = Infinity;
    for (let t = 0; t < 6; t += step) {
      gravityStep(rock, step);
      const [px, py] = playerAt(t + step);
      best = Math.min(best, Math.hypot(rock.x - px, rock.y - py));
    }
    return best;
  }

  // Hunters try several leads and keep the launch velocity whose curved path meets the satellite
  function hunterVelocity(x, y, speed) {
    let bestMiss = Infinity, best = [0, 0];
    for (let lead = 0.5; lead <= 4.5; lead += 0.25) {
      const [tx, ty] = playerAt(lead);
      const len = Math.hypot(tx - x, ty - y);
      const vx = ((tx - x) / len) * speed, vy = ((ty - y) / len) * speed;
      const miss = closestApproach(x, y, vx, vy);
      if (miss < bestMiss) { bestMiss = miss; best = [vx, vy]; }
    }
    return best;
  }

  function spawnAsteroid() {
    const ang = rand(0, TAU);
    const x = Math.cos(ang) * SPAWN_R, y = Math.sin(ang) * SPAWN_R;
    const speed = rand(130, 170) * Math.min(2.2, 1 + elapsed * 0.012);
    let vx, vy;
    // Hunters become more common the longer you survive: 30% at the start, capped at 60%
    if (Math.random() < Math.min(0.6, 0.3 + elapsed * 0.005)) {
      [vx, vy] = hunterVelocity(x, y, speed);
    } else {
      // Drifters aim near the sun so they swing past it on curved paths
      const aim = rand(0, TAU), aimR = rand(0, 260);
      const dx = Math.cos(aim) * aimR - x, dy = Math.sin(aim) * aimR - y, len = Math.hypot(dx, dy);
      vx = (dx / len) * speed;
      vy = (dy / len) * speed;
    }
    const shape = Array.from({ length: 8 }, () => rand(0.7, 1.1));
    asteroids.push({
      x, y, vx, vy,
      r: rand(8, 15), shape, spin: rand(0, TAU), spinRate: rand(-2, 2), age: 0, near: false,
    });
  }

  function spawnStardust() {
    stardust.push({
      theta: rand(0, TAU), r: rand(R_MIN + 20, R_BASE + 90),
      w: rand(0.12, 0.3) * (Math.random() < 0.5 ? -1 : 1),
      x: 0, y: 0, life: 7, ph: rand(0, TAU),
    });
  }

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU), s = rand(0.2, 1) * speed;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: rand(0.7, 1.8), size: rand(1.5, 4), color,
      });
    }
  }

  function ring(x, y, color) {
    rings.push({ x, y, r: PLAYER_R, color, life: 1 });
  }

  function popup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 1 });
  }

  function update(dt) {
    elapsed += dt;
    const p = player;
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnAsteroid();
      spawnTimer = Math.max(0.35, 1.7 - elapsed * 0.02) * rand(0.7, 1.3);
    }
    starTimer -= dt;
    if (starTimer <= 0) {
      spawnStardust();
      starTimer = rand(0.9, 1.6);
    }

    // Hold to dive toward the sun; let go and you spiral back out
    const target = diving ? R_MIN : R_BASE;
    p.r += (target - p.r) * Math.min(1, dt * (diving ? 2.6 : 1.5));
    p.heat = clamp((R_BASE - p.r) / (R_BASE - R_MIN), 0, 1);
    // Closer orbits sweep faster, so diving is also a sprint
    p.theta += p.dir * (0.9 + 1.6 * p.heat) * dt;
    placePlayer();

    const mult = multiplier();
    score += dt * 10 * mult;

    for (const s of stardust) {
      s.theta += s.w * dt;
      s.x = Math.cos(s.theta) * s.r;
      s.y = Math.sin(s.theta) * s.r;
      s.life -= dt;
    }
    stardust = stardust.filter((s) => {
      if (s.life <= 0) return false;
      if (Math.hypot(s.x - p.x, s.y - p.y) < 20) {
        // Chain stardust quickly to stack a bonus; each pickup in the chain sings a little higher
        combo = comboTimer > 0 ? combo + 1 : 1;
        comboTimer = 3;
        const gain = 50 * mult * Math.min(combo, 5);
        score += gain;
        burst(s.x, s.y, '#7cf7ff', 14, 160);
        popup(s.x, s.y - 14, combo > 1 ? `+${gain} CHAIN ×${combo}` : `+${gain}`, '#7cf7ff');
        tone(960 + Math.min(combo, 6) * 70, 0.12, 'sine', 0.06, 1.6);
        return false;
      }
      return true;
    });

    let hit = false;
    asteroids = asteroids.filter((a) => {
      gravityStep(a, dt);
      const d = Math.hypot(a.x, a.y);
      a.spin += a.spinRate * dt;
      a.age += dt;

      if (d < SUN_R) { // swallowed by the corona: a bonus for the risk
        const gain = 20 * mult;
        score += gain;
        burst(a.x, a.y, '#ffb36b', 16, 220);
        popup(a.x, a.y - 14, `+${gain}`, '#ffb36b');
        return false;
      }
      if (a.age > 25 || d > 1200) return false;

      const gap = Math.hypot(a.x - p.x, a.y - p.y) - a.r - PLAYER_R;
      if (gap < 0) {
        hit = true;
      } else if (gap < NEAR_MISS && !a.near) { // skim past without touching: reward the nerve
        a.near = true;
        const gain = 30 * mult;
        score += gain;
        popup(p.x, p.y - 22, `NEAR MISS +${gain}`, '#fff3c4');
        ring(p.x, p.y, '#fff3c4');
      }
      return true;
    });
    if (hit) die();
  }

  function idle(dt) {
    player.theta += 0.9 * dt; // title screen: the satellite orbits on its own
    placePlayer();
  }

  function updateFx(dt) {
    shake = Math.max(0, shake - dt * 30);
    for (const q of particles) {
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vx *= 0.97;
      q.vy *= 0.97;
      q.life -= q.decay * dt;
    }
    particles = particles.filter((q) => q.life > 0);
    for (const t of trail) t.life -= dt * 2.4;
    trail = trail.filter((t) => t.life > 0);
    for (const r of rings) {
      r.r += dt * 220;
      r.life -= dt * 2.2;
    }
    rings = rings.filter((r) => r.life > 0);
    for (const p of popups) {
      p.y -= dt * 34;
      p.life -= dt * 0.9;
    }
    popups = popups.filter((p) => p.life > 0);
  }

  // ---------- state & input ----------

  function showOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.remove('hidden');
    vignetteEl.style.opacity = 0;
  }

  function showTitle() {
    document.body.classList.remove('playing', 'paused');
    showOverlay(`
      <h1>ORBIT FLIP</h1>
      <p>Click or tap to reverse your orbit.</p>
      <p>Hold to dive toward the sun. The hotter you burn, the bigger your multiplier.</p>
      <p>Grab the cyan stardust. Skim asteroids for near-miss bonuses. The sun bends their paths too.</p>
      ${best ? `<p>Best <b>${best}</b></p>` : ''}
      <p class="hint">Click, tap or press Space to launch · M mutes sound</p>`);
  }

  function start() {
    reset();
    state = 'play';
    diving = true;
    document.body.classList.remove('paused');
    document.body.classList.add('playing');
    overlay.classList.add('hidden');
  }

  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    diving = false;
    document.body.classList.remove('playing');
    document.body.classList.add('paused');
    showOverlay(`
      <h1>PAUSED</h1>
      <p class="hint">Press P or click to resume</p>`);
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'play';
    document.body.classList.remove('paused');
    document.body.classList.add('playing');
    overlay.classList.add('hidden');
  }

  function die() {
    state = 'over';
    overAt = performance.now();
    diving = false;
    shake = 24;
    burst(player.x, player.y, '#ffb36b', 70, 420);
    burst(player.x, player.y, '#7cf7ff', 30, 240);
    tone(180, 0.6, 'sawtooth', 0.08, 0.25);
    document.body.classList.remove('playing', 'paused');

    const final = Math.floor(score);
    const newBest = final > best;
    if (newBest) {
      best = final;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
    }
    showOverlay(`
      <h1>BURNED OUT</h1>
      <p>Score <b>${final.toLocaleString()}</b> &nbsp;·&nbsp; Best <b>${best.toLocaleString()}</b></p>
      ${newBest ? '<p>New personal best!</p>' : ''}
      <p class="hint">Click or press Space to orbit again</p>`);
  }

  let audio = null;
  function ensureAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }

  function tone(freq, dur, type, vol, slide) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }

  function onDown() {
    ensureAudio();
    if (state === 'title') return start();
    if (state === 'paused') return resume();
    if (state === 'over') {
      if (performance.now() - overAt > 600) start(); // ignore mashing right at death
      return;
    }
    player.dir *= -1;   // a click reverses the orbit
    diving = true;
    ring(player.x, player.y, heatColor(player.heat));
    tone(520, 0.12, 'triangle', 0.05, 1.8);
  }

  function onUp() { diving = false; }

  window.addEventListener('pointerdown', onDown);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) onDown();
    } else if (e.code === 'KeyM' && !e.repeat) {
      muted = !muted;
    } else if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
      if (state === 'paused') resume();
      else pause();
    }
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') onUp(); });
  // Don't let a hidden tab kill you: pause as soon as focus leaves
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', pause);

  // ---------- rendering ----------

  function heatColor(h) {
    const cold = [124, 247, 255], hot = [255, 179, 107];
    const [r, g, b] = cold.map((c, i) => Math.round(lerp(c, hot[i], h)));
    return `rgb(${r}, ${g}, ${b})`;
  }

  function drawHud() {
    scoreEl.textContent = Math.floor(score).toLocaleString();
    multEl.textContent = `×${multiplier()}`;
    chainEl.textContent = comboTimer > 0 && combo > 1 ? `CHAIN ×${combo}` : '';
    heatEl.style.width = `${(player.heat * 100).toFixed(1)}%`;
    vignetteEl.style.opacity = (player.heat * 0.9).toFixed(3);
  }

  function drawSun() {
    const pulse = 1 + 0.06 * Math.sin(clock * 2.2);
    const glowR = SUN_R * 4 * pulse;
    const glow = ctx.createRadialGradient(0, 0, SUN_R * 0.6, 0, 0, glowR);
    glow.addColorStop(0, 'rgba(255, 170, 80, 0.55)');
    glow.addColorStop(0.45, 'rgba(255, 90, 40, 0.15)');
    glow.addColorStop(1, 'rgba(255, 60, 20, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, TAU);
    ctx.fill();

    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, SUN_R);
    core.addColorStop(0, '#fff8e0');
    core.addColorStop(0.55, '#ffc25a');
    core.addColorStop(1, '#ff6a2a');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(0, 0, SUN_R * pulse, 0, TAU);
    ctx.fill();
  }

  function drawOrbitGuides() {
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 10]);
    ctx.strokeStyle = `rgba(124, 247, 255, ${0.12 + 0.2 * player.heat})`;
    ctx.beginPath();
    ctx.arc(0, 0, R_BASE, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = `rgba(255, 179, 107, ${0.08 + 0.35 * player.heat})`;
    ctx.beginPath();
    ctx.arc(0, 0, R_MIN, 0, TAU);
    ctx.stroke();
  }

  function drawStardust() {
    for (const s of stardust) {
      const tw = 0.7 + 0.3 * Math.sin(clock * 6 + s.ph);
      ctx.globalAlpha = Math.min(1, s.life);
      ctx.fillStyle = 'rgba(124, 247, 255, 0.25)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, 14 * tw, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#e8feff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3.2, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Dotted preview of the next 2.5 seconds of a rock's curved path, so the sun's pull can be read and dodged
  function drawTrajectory(a) {
    const rock = { x: a.x, y: a.y, vx: a.vx, vy: a.vy };
    ctx.beginPath();
    ctx.moveTo(rock.x, rock.y);
    for (let t = 0; t < 2.5; t += 0.05) {
      gravityStep(rock, 0.05);
      if (Math.hypot(rock.x, rock.y) < SUN_R) break;
      ctx.lineTo(rock.x, rock.y);
    }
    ctx.setLineDash([2, 8]);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255, 200, 150, 0.3)';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawAsteroids() {
    for (const a of asteroids) {
      drawTrajectory(a);
      const speed = Math.hypot(a.vx, a.vy) || 1;
      const nearSun = clamp(1 - Math.hypot(a.x, a.y) / R_BASE, 0, 1);

      // Motion streak, glowing hotter as it falls toward the sun
      ctx.strokeStyle = `rgba(255, 170, 110, ${0.25 + 0.4 * nearSun})`;
      ctx.lineWidth = a.r * 0.9;
      ctx.beginPath();
      ctx.moveTo(a.x - (a.vx / speed) * a.r * 5, a.y - (a.vy / speed) * a.r * 5);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();

      ctx.beginPath();
      a.shape.forEach((k, i) => {
        const ang = a.spin + (i / a.shape.length) * TAU;
        const x = a.x + Math.cos(ang) * a.r * k;
        const y = a.y + Math.sin(ang) * a.r * k;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = `rgb(${120 + 135 * nearSun}, ${105 + 75 * nearSun}, 125)`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255, 220, 190, ${0.3 + 0.4 * nearSun})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  function drawTrail() {
    ctx.fillStyle = heatColor(player.heat);
    for (const t of trail) {
      ctx.globalAlpha = Math.max(0, t.life) * 0.5;
      ctx.beginPath();
      ctx.arc(t.x, t.y, PLAYER_R * t.life, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = player, col = heatColor(p.heat);
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PLAYER_R * 4);
    glow.addColorStop(0, col);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_R * 4, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_R, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_R + 3, 0, TAU);
    ctx.stroke();

    // Arrowhead along the direction of travel, so the current orbit reads at a glance
    const tx = -Math.sin(p.theta) * p.dir, ty = Math.cos(p.theta) * p.dir;
    const nx = -ty, ny = tx;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(p.x + tx * (PLAYER_R + 12), p.y + ty * (PLAYER_R + 12));
    ctx.lineTo(p.x + tx * (PLAYER_R + 5) + nx * 4, p.y + ty * (PLAYER_R + 5) + ny * 4);
    ctx.lineTo(p.x + tx * (PLAYER_R + 5) - nx * 4, p.y + ty * (PLAYER_R + 5) - ny * 4);
    ctx.closePath();
    ctx.fill();
  }

  function drawRings() {
    ctx.lineWidth = 2;
    for (const r of rings) {
      ctx.globalAlpha = clamp(r.life, 0, 1) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const q of particles) {
      ctx.globalAlpha = clamp(q.life, 0, 1);
      ctx.fillStyle = q.color;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.font = '700 17px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // Screen-space markers on the edge for asteroids still off-screen, so nothing sneaks up on you
  function drawIncomingWarnings() {
    const hx = (W / 2 - 24) / scale, hy = (H / 2 - 24) / scale; // world-unit bounds inset from the edge
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffb36b';
    for (const a of asteroids) {
      if (Math.abs(a.x) <= hx && Math.abs(a.y) <= hy) continue;
      const k = Math.min(hx / Math.max(Math.abs(a.x), 1), hy / Math.max(Math.abs(a.y), 1));
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(W / 2 + a.x * k * scale, H / 2 + a.y * k * scale, 4, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#05030f';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#cfc8ff';
    for (const s of bgStars) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(clock * 1.3 + s.ph));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // World space: the sun sits at the origin; screen shake is a positional jitter
    const jx = (Math.random() - 0.5) * shake, jy = (Math.random() - 0.5) * shake;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (W / 2 + jx) * dpr, (H / 2 + jy) * dpr);

    drawSun();
    drawOrbitGuides();
    drawStardust();
    drawAsteroids();
    drawTrail();
    drawPlayer();
    drawRings();
    drawParticles();
    drawPopups();
    drawIncomingWarnings();
  }

  // ---------- loop ----------

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    clock += dt;

    if (state === 'play') { update(dt); drawHud(); }
    else if (state === 'title') idle(dt);

    updateFx(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
